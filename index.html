        /* סרגל עליון */

            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* הצד השמאלי - מחולק ל-2 */
        .side-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {

            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .info-card:hover {
            transform: translateY(-5px);

        .circle-logo {
            width: 70px;

            border-radius: 50%;

            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .circle-logo img {
            width: 100%;
            height: auto;

        .info-link {
            color: #555;
